[package]
name = "fx-desktop"
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"

[[bin]]
name = "fx-desktop"
path = "src/main.rs"

[dependencies]
# The grammars colour the code blocks in answers; each one is a feature.
gpui-kit = { version = "0.6.1", features = [
    "tree-sitter",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
anyhow = "1"
# Already in the tree through gpui-component; used directly for the answer view.
markdown = "1"
# Also already in the tree; home groups sessions by local day.
chrono = "0.4"
# In the tree as well; ACP carries images as Base64.
base64 = "0.22"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
