name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: scripts/package.sh
      - run: hdiutil verify dist/fx-*.dmg
      - name: Verify packaged app
        run: |
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/fx-dmg" dist/fx-*.dmg
          trap 'hdiutil detach "$RUNNER_TEMP/fx-dmg"' EXIT
          codesign --verify --deep --strict "$RUNNER_TEMP/fx-dmg/fx.app"
